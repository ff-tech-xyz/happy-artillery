# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Loom 1.17 resolves custom Minecraft metadata during configuration, so its ephemeral URL cannot be reused from a configuration-cache entry.
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.0-alpha.7
fabric_api_version=0.153.0+26.2

# Mod Properties
mod_version=1.2.0
maven_group=happy.artillery
archives_base_name=happy-artillery
