plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}"
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"happy-artillery" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Compile only against the APIs used here; local runs retain the full Fabric API.
	compileOnly("net.fabricmc.fabric-api:fabric-command-api-v2:3.1.2+fcdff87f5d") { transitive = false }
	compileOnly("net.fabricmc.fabric-api:fabric-events-interaction-v0:5.3.6+3434d6d95d") { transitive = false }
	compileOnly("net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.9+ffef5f675d") { transitive = false }
	compileOnly("net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.8+fcdff87f5d") { transitive = false }
	compileOnly("net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d") { transitive = false }
	compileOnly("net.fabricmc.fabric-api:fabric-data-attachment-api-v1:2.2.30+3434d6d95d") { transitive = false }

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "net.fabricmc.fabric-api:fabric-data-attachment-api-v1:2.2.30+3434d6d95d"
	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def resourceVersion = project.version
processResources {
	inputs.property "version", resourceVersion

	filesMatching("fabric.mod.json") {
		expand "version": resourceVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('check') {
	dependsOn tasks.named('test')
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def licenseArchiveSuffix = project.archives_base_name
jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${licenseArchiveSuffix}"}
	}

	manifest {
		attributes(
			'Environment': 'universal'
		)
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
		mavenLocal()
	}
}

